<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>系统态 A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 480px; height: 1100px; box-sizing: border-box; padding: 40px; background: #E6E7EB; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; color: #1D1D1F; display: flex; flex-direction: column; gap: 28px">

<div>
<div style="font: 600 11px -apple-system, sans-serif; letter-spacing: .4px; color: #8A8A92; margin-bottom: 8px">① 输入框</div>
<div style="width: 400px; height: 48px; box-sizing: border-box; background: #FBFBFD; border-radius: 18px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 12px 40px rgba(0,0,0,0.14); padding: 0 16px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#5B3FD6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 3.5h7M5.5 2v1.5M3.5 3.5c.5 2.5 2.5 4.5 5 5.5M7.5 3.5c-.5 2.5-2.5 4.5-5 5.5"></path><path d="M8.5 14l2.75-6.5L14 14M9.4 12h3.7"></path></svg>
<div style="display: flex; align-items: center; gap: 1px; font-size: 15px; line-height: 20px">
<span aria-hidden="true" style="width: 2px; height: 20px; border-radius: 1px; background: #5B3FD6"></span>
<span style="color: #6E6E73">输入要翻译的文字</span>
</div>
</div>
</div>

<div>
<div style="font: 600 11px -apple-system, sans-serif; letter-spacing: .4px; color: #8A8A92; margin-bottom: 8px">② 读取中</div>
<div style="width: 400px; box-sizing: border-box; background: #FBFBFD; border-radius: 18px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 12px 40px rgba(0,0,0,0.14); padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="height: 22px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6E6E73"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="#DDD7FB" stroke-width="2"></circle><path d="M8 2a6 6 0 0 1 6 6" stroke="#5B3FD6" stroke-width="2" stroke-linecap="round"></path></svg>正在读取选中的文字…</div>
</div>
</div>

<div>
<div style="font: 600 11px -apple-system, sans-serif; letter-spacing: .4px; color: #8A8A92; margin-bottom: 8px">③ 失败</div>
<div style="width: 400px; box-sizing: border-box; background: #FBFBFD; border-radius: 18px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 12px 40px rgba(0,0,0,0.14); padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 999px; background: #FFF0DE; color: #C25E00; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2l6.2 11H1.8z"></path><path d="M8 6.6v3M8 11.4v.1"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 1px">
<div style="font-size: 15px; font-weight: 600; line-height: 20px">无法连接到 OpenAI</div>
<div style="font-size: 13px; line-height: 1.5; color: #6E6E73">网络连接似乎已断开。已改用 Apple 翻译。</div>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 4px">
<button style="height: 32px; border: 0; border-radius: 999px; background: #5B3FD6; color: #FFFFFF; padding: 0 7px 0 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">重试<span style="min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 5px; background: rgba(255,255,255,0.22); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">↩</span></button>
</div>
</div>
</div>

<div>
<div style="font: 600 11px -apple-system, sans-serif; letter-spacing: .4px; color: #8A8A92; margin-bottom: 8px">④ 需要权限</div>
<div style="width: 400px; box-sizing: border-box; background: #FBFBFD; border-radius: 18px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 12px 40px rgba(0,0,0,0.14); padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 999px; background: #ECE8FF; color: #5B3FD6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.6"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 1px">
<div style="font-size: 15px; font-weight: 600; line-height: 20px">需要辅助功能权限</div>
<div style="font-size: 13px; line-height: 1.5; color: #6E6E73">Dict 需要辅助功能权限才能读取你选中的文字。打开系统设置，在“隐私与安全性 → 辅助功能”里打开 Dict。</div>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 4px">
<button style="height: 32px; border: 0; border-radius: 999px; background: #EFEFF2; color: #1D1D1F; padding: 0 14px; font-size: 13px; font-weight: 600">以后再说</button>
<button style="height: 32px; border: 0; border-radius: 999px; background: #5B3FD6; color: #FFFFFF; padding: 0 7px 0 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">打开系统设置<span style="min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 5px; background: rgba(255,255,255,0.22); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">↩</span></button>
</div>
</div>
</div>

<div>
<div style="font: 600 11px -apple-system, sans-serif; letter-spacing: .4px; color: #8A8A92; margin-bottom: 8px">⑤ 需要模型</div>
<div style="width: 400px; box-sizing: border-box; background: #FBFBFD; border-radius: 18px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 12px 40px rgba(0,0,0,0.14); padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 999px; background: #ECE8FF; color: #5B3FD6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><circle cx="8" cy="8" r="4.4"></circle><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 1px">
<div style="font-size: 15px; font-weight: 600; line-height: 20px">需要配置翻译模型</div>
<div style="font-size: 13px; line-height: 1.5; color: #6E6E73">Dict 用你自己的 API 密钥请求你选择的模型来翻译。打开设置，在“模型”里填写密钥，或使用这台 Mac 上的 Ollama。</div>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 4px">
<button style="height: 32px; border: 0; border-radius: 999px; background: #5B3FD6; color: #FFFFFF; padding: 0 7px 0 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">打开设置<span style="min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 5px; background: rgba(255,255,255,0.22); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">↩</span></button>
</div>
</div>
</div>

</div>
</x-dc>

</html>
