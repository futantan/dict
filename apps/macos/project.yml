# SPDX-License-Identifier: GPL-3.0-or-later
#
# XcodeGen spec. Run `make generate` to produce DictApp.xcodeproj (not tracked).
# Names, bundle identifiers and signing live in Config/*.xcconfig.

name: DictApp

options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  DictCore:
    path: Packages/DictCore
  # Auto-update (architecture 15.6 and 16.1 #6). MIT; its notice ships in
  # the app's Acknowledgements. Pinned exactly: a Sparkle update is a reviewed change.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  DictApp:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: DictCore
      # A binary framework: Xcode embeds it and re-signs it with our identity, which the
      # hardened runtime's library validation requires.
      - package: Sparkle
    # The dictionary is built by `make dict` and never tracked (architecture 7.2). When it is
    # there it ships in Resources with its licence and attribution; without it the app
    # builds and runs with no instant layer.
    postCompileScripts:
      - name: Copy the dictionary
        basedOnDependencyAnalysis: false
        # Declared so that signing runs again whenever the script changes them.
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/dict-en-zh.sqlite
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/dict-en-zh-LICENSE
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/dict-en-zh-ATTRIBUTION
        script: |
          source="$SRCROOT/build/dict"
          resources="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ -f "$source/dict-en-zh.sqlite" ] && [ -f "$source/LICENSE" ] \
            && [ -f "$source/ATTRIBUTION" ]; then
            mkdir -p "$resources"
            # Copies only what changed: an untouched bundle keeps its signature.
            for pair in dict-en-zh.sqlite:dict-en-zh.sqlite LICENSE:dict-en-zh-LICENSE \
              ATTRIBUTION:dict-en-zh-ATTRIBUTION; do
              from="$source/${pair%%:*}" to="$resources/${pair#*:}"
              cmp -s "$from" "$to" || cp "$from" "$to"
            done
          else
            echo "note: no dictionary in build/dict (run make dict): building without it"
            rm -f "$resources/dict-en-zh.sqlite" "$resources/dict-en-zh-LICENSE" \
              "$resources/dict-en-zh-ATTRIBUTION"
          fi
    # Xcode re-signs the embedded Sparkle.framework but leaves its helpers (Autoupdate, the
    # updater app, the XPC services) ad hoc. Sign them with our identity too, inside out, as
    # Sparkle's documentation asks; the app itself is signed after this phase.
    postBuildScripts:
      - name: Sign Sparkle's helpers
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          sparkle="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          [ -d "$sparkle" ] || { echo "error: Sparkle.framework is not embedded"; exit 1; }
          sign() {
            # OTHER_CODE_SIGN_FLAGS carries --timestamp when notarizing (scripts/package.sh).
            # shellcheck disable=SC2086
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime \
              ${OTHER_CODE_SIGN_FLAGS:-} "$@"
          }
          sign "$sparkle/Versions/B/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$sparkle/Versions/B/XPCServices/Downloader.xpc"
          sign "$sparkle/Versions/B/Autoupdate"
          sign "$sparkle/Versions/B/Updater.app"
          sign "$sparkle"
    settings:
      base:
        PRODUCT_NAME: $(DICT_APP_NAME)
        # The dictionary script reads build/dict, which may not exist, so it cannot declare
        # its inputs to the script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_MODULE_NAME: DictApp
        PRODUCT_BUNDLE_IDENTIFIER: $(DICT_APP_BUNDLE_ID)
        # Option A's accent fill (Design/option-a/README.md, `Palette.accentFill`), so native
        # controls such as the default button and switches match the panel.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys, which have no INFOPLIST_KEY_ setting; merged with the generated ones.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: $(DICT_APP_NAME)
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_NSHumanReadableCopyright: Licensed under GPL-3.0-or-later.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  DictAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: DictApp
      - package: DictCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DICT_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(DICT_APP_NAME).app/Contents/MacOS/$(DICT_APP_NAME)
        BUNDLE_LOADER: $(TEST_HOST)

  # End-to-end test fixture (architecture 14.3). Built with the DictApp scheme so that
  # `make build` keeps it compiling; it is never embedded in the app.
  CaptureFixture:
    type: application
    platform: macOS
    sources:
      - Fixtures/CaptureFixture/Sources
      - path: Fixtures/CaptureFixture/Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: CaptureFixture
        PRODUCT_BUNDLE_IDENTIFIER: $(DICT_BUNDLE_ID).fixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Licensed under GPL-3.0-or-later.
        ENABLE_APP_SANDBOX: NO

schemes:
  DictApp:
    build:
      targets:
        DictApp: all
        CaptureFixture: all
    test:
      targets:
        - DictAppTests
      # Tests read English text; the app's default UI language is Simplified Chinese.
      commandLineArguments:
        "-AppleLanguages (en)": true
